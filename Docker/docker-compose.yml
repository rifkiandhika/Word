services:
  onlyoffice:
    image: onlyoffice/documentserver:latest   # setelah berjalan, pin ke versi tertentu
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET}"   # isi di file .env di sebelah docker-compose.yml
      # Laravel biasanya ada di IP private (192.168.x.x / 10.x.x.x / localhost).
      # Tanpa ini Document Server bisa menolak mengunduh file & memanggil callback.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"    # supaya container bisa menjangkau Laravel di host
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice

volumes:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_lib: